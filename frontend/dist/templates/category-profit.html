<h2 class="mb-4">Доходы</h2>
<div class="d-flex flex-wrap gap-4" id="categories-income">
    <div class="category-card">
        <h5>Депозиты</h5>
        <div class="mt-3 d-flex gap-2">
            <button class="btn btn-primary btn-sm" style="width: 134px;">Редактировать</button>
            <button class="btn btn-danger btn-sm">Удалить</button>
        </div>
    </div>
    <div class="category-card">
        <h5>Зарплата</h5>
        <div class="mt-3 d-flex gap-2">
            <button class="btn btn-primary btn-sm">Редактировать</button>
            <button class="btn btn-danger btn-sm">Удалить</button>
        </div>
    </div>
    <div class="category-card">
        <h5>Сбережения</h5>
        <div class="mt-3 d-flex gap-2">
            <button class="btn btn-primary btn-sm">Редактировать</button>
            <button class="btn btn-danger btn-sm">Удалить</button>
        </div>
    </div>
    <div class="category-card">
        <h5>Инвестиции</h5>
        <div class="mt-3 d-flex gap-2">
            <button class="btn btn-primary btn-sm">Редактировать</button>
            <button class="btn btn-danger btn-sm">Удалить</button>
        </div>
    </div>

    <!-- Добавить категорию -->
    <div class="category-card add-category">
        <span>+</span>
    </div>
    <div class="modal-overlay" id="confirmModal" style="display: none;">
        <div class="modal-content">
            <p>Вы действительно хотите удалить категорию?<br>
                Связанные доходы останутся без категории.</p>
            <div class="d-flex justify-content-center gap-3 mt-4">
                <button class="btn btn-success" id="confirmDeleteBtn">Да, удалить</button>
                <button class="btn btn-danger" id="cancelDeleteBtn">Не удалять</button>
            </div>
        </div>
    </div>
</div>
