<div class="container-fluid   profit-costs">
    <h2 class="mb-5 profit-title">Доходы и Расходы</h2>

    <!-- Кнопки -->
    <div class="mb-5 d-flex gap-2">
        <button class="btn btn-success">Создать доход</button>
        <button class="btn btn-danger">Создать расход</button>
    </div>

    <!-- Фильтрация -->
    <div class="filters d-flex flex-wrap align-items-center gap-2 mb-4">

        <!-- Кнопки выбора периода -->
        <button class="btn filter-btn active" data-period="today">Сегодня</button>
        <button class="btn filter-btn" data-period="week">Неделя</button>
        <button class="btn filter-btn" data-period="month">Месяц</button>
        <button class="btn filter-btn" data-period="year">Год</button>
        <button class="btn filter-btn" data-period="all">Все</button>
        <button class="btn filter-btn" data-period="interval">Интервал</button>

        <div class="date-filter d-flex align-items-center ms-3">
            <span class="me-1">с  </span>
            <a class="date-link me-2" href="#">Дата</a>
            <span class="me-1">по  </span>
            <a class="date-link" href="#">Дата</a>
        </div>
    </div>


    <!-- Таблица -->
    <div class="table-responsive">
    <table class="table custom-table align-middle table table-bordered">
        <thead>
        <tr class="align-middle text-center">
            <th>№ операции</th>
            <th>Тип</th>
            <th>Категория</th>
            <th>Сумма</th>
            <th>Дата</th>
            <th>Комментарий</th>
        </tr>
        </thead>
        <tbody class="align-middle">
        <tr class="align-middle text-center">
            <td>1</td>
            <td><span class="text-success">Доход</span></td>
            <td>Зарплата</td>
            <td>1000 $</td>
            <td>2025-06-18</td>
            <td>Бонус за проект</td>
            <td class="text-end">
                <div class="action-buttons">
                    <button class="icon-btn">
                        <i class="bi bi-trash"></i>
                    </button>
                    <button class="icon-btn">
                        <i class="bi bi-pencil"></i>
                    </button>
                </div>

            </td>
        </tr>
        <tr class="align-middle text-center">
            <td>1</td>
            <td><span class="text-danger">Расход</span></td>
            <td>Зарплата</td>
            <td>1000 $</td>
            <td>2025-06-18</td>
            <td>Бонус за проект</td>
            <td class="text-end">
                <div class="action-buttons">
                    <button class="icon-btn">
                        <i class="bi bi-trash"></i>
                    </button>
                    <button class="icon-btn">
                        <i class="bi bi-pencil"></i>
                    </button>
                </div>
            </td>
        </tr>
        <!-- другие строки -->
        </tbody>
    </table>
</div>
<!-- Модалка выбора диапазона дат -->
<div aria-hidden="true" class="modal fade" id="dateModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content rounded-4 shadow-sm">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-bold">Выбор периода</h5>
                <button aria-label="Закрыть" class="btn-close" data-bs-dismiss="modal" type="button"></button>
            </div>
            <div class="modal-body pt-0">
                <div class="mb-3">
                    <label class="form-label small" for="startDateInput">Начальная дата</label>
                    <input class="form-control rounded-3" id="startDateInput" type="date">
                </div>
                <div class="mb-3">
                    <label class="form-label small" for="endDateInput">Конечная дата</label>
                    <input class="form-control rounded-3" id="endDateInput" type="date">
                </div>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button class="btn btn-primary w-100 rounded-3" id="applyDateBtn" type="button">Применить</button>
            </div>
        </div>
    </div>
</div>
